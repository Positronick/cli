# Actions are pinned to commit SHAs (supply-chain hardening for a public repo);
# Dependabot bumps the SHAs and version comments together.
name: Release

on:
  push:
    tags:
      - 'v*'

# Write permissions are granted per job so no job silently inherits them.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # goreleaser's sboms section shells out to syft.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publisher credentials. Each publisher in .goreleaser.yaml gates itself
          # on its env var being non-empty, so a missing secret skips that channel
          # instead of failing the release.
          # Pushes the formula to Positronick/homebrew-tap (owner-created PAT).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Pushes the manifest to Positronick/scoop-bucket (owner-created PAT).
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          # Opens a PR to microsoft/winget-pkgs from the Positronick/winget-pkgs
          # fork (classic PAT, public_repo scope).
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          # Pushes the PKGBUILD to aur.archlinux.org/positronick-bin (SSH key).
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  npm:
    # Publishes positronick + the four @positronick/cli-* platform packages via
    # npm Trusted Publishing (OIDC — no token secret; needs npm >= 11.5.1, which
    # Node 24 bundles). Gated on the NPM_PUBLISH repo variable because the
    # one-time bootstrap is manual: claim the names with a first manual publish,
    # configure this repo+workflow as the trusted publisher for all five
    # packages on npmjs.com, then set NPM_PUBLISH=true. See packages/npm/README.md.
    if: vars.NPM_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Repackage what was actually released (and checksum-verified), not a
      # rebuild: download the published archives from the GitHub release.
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'positronick_*.tar.gz' --pattern 'checksums.txt' --dir dist
          cd dist
          grep -E ' positronick_(linux|darwin)_(amd64|arm64)\.tar\.gz$' checksums.txt | sha256sum -c

      - name: Build npm packages
        run: ./scripts/build-npm-packages.sh "${GITHUB_REF_NAME#v}" dist npm-dist

      # Platform packages must exist on the registry before the meta-package
      # that pins them in optionalDependencies.
      # Prereleases (any version with a hyphen, e.g. v0.2.0-rc.1) go to the
      # `next` dist-tag so `npm install positronick` keeps serving the latest
      # stable. Already-published versions are skipped so a partially failed
      # run can be re-run without dying on EPUBLISHCONFLICT.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          for pkg in npm-dist/@positronick/* npm-dist/positronick; do
            name=$(node -p "require('./$pkg/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip: $name@$version already published"
              continue
            fi
            npm publish "$pkg" --access public --tag "$tag"
          done
