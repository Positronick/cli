# Actions are pinned to commit SHAs (supply-chain hardening for a public repo);
# Dependabot bumps the SHAs and version comments together.
name: Release

on:
  push:
    tags:
      - 'v*'

# Write permissions are granted per job so future jobs (e.g. the npm publish
# TODO below) don't silently inherit them.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # goreleaser's sboms section shells out to syft.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the formula to Positronick/homebrew-tap (owner-created PAT).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # TODO: npm publish — packages/npm/ is scaffolded but the "positronick" npm
      # name is not claimed yet. Once it is: build per-platform packages from
      # dist/, fill real versions, and `npm publish` them here.
