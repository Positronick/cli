# Actions are pinned to commit SHAs (supply-chain hardening for a public repo);
# Dependabot bumps the SHAs and version comments together.
# Never introduce pull_request_target here without a security review — it runs
# fork code with secrets and a write token.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go test ./... -race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # Keep in sync with GOLANGCI_VERSION in the Makefile.
          version: v2.12.2

  # govulncheck and actionlint are compiled via `go run tool@version`, so this
  # job keys its cache on the Makefile too (where those versions are pinned) —
  # a plain go.sum key would collide with the other jobs and never retain the
  # tool builds.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            Makefile
      - name: go.mod/go.sum drift
        run: go mod tidy -diff
      - name: govulncheck
        # Keep the version in sync with GOVULNCHECK in the Makefile.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...
      - name: shellcheck install.sh
        run: shellcheck install.sh
      - name: actionlint
        # Keep the version in sync with ACTIONLINT in the Makefile.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go build ./cmd/positronick
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
