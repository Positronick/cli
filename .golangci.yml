version: "2"

linters:
  enable:
    - errcheck
    - govet
    - misspell
    - revive
    - staticcheck
  exclusions:
    presets:
      - std-error-handling
    rules:
      # main.go is a pinned, delegation-only entrypoint; no package doc needed.
      - path: cmd/positronick/main\.go
        text: 'package-comments'
        linters:
          - revive
      # APIError is the PR-B1 spec'd name; api.Error would shadow the error
      # interface at call sites and read worse than the "stutter".
      - path: internal/api/errors\.go
        text: 'and that stutters'
        linters:
          - revive
      # APIKey mirrors the product concept ("API key", the x-api-key header);
      # api.Key would read as a key of the client, not the credential.
      - path: internal/api/auth\.go
        text: 'and that stutters'
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
